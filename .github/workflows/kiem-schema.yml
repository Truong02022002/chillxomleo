name: Kiem structured data

# Chay tools/kiem-schema.mjs tren toan site sau moi lan push co doi file .html. Workflow nay
# chi DOC — khong sua, khong push. Co LOI thi run do va GitHub gui mail cho chu repo; canh bao
# chi nam trong log. Muc dich: bat schema bi mat, trung hoac sai sau khi sua khuon trang,
# nav, footer, CSP... ma khong ai de y.
#
# Bai dang theo lich khong di qua day (push cua bot khong kich hoat workflow khac), nen
# dang-bai-theo-lich.yml tu chay kiem-schema TRUOC khi commit.

on:
  push:
    branches: [main]
    paths: ['**.html', 'tools/kiem-schema.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - name: Lay main
        uses: actions/checkout@v4

      - name: Cai Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kiem schema toan site
        run: node tools/kiem-schema.mjs
