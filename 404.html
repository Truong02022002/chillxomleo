<!-- Google tag (gtag.js) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Load GA4 at the first of: user interaction, or window load.
  // (Was a fixed 3.5s timeout, which dropped every session shorter than that.)
  (function () {
    var started = false;
    function loadGA() {
      if (started) return;
      started = true;
      var s = document.createElement('script');
      s.src = "https://www.googletagmanager.com/gtag/js?id=G-YWGENK065S";
      s.async = true;
      document.head.appendChild(s);
      gtag('config', 'G-YWGENK065S');
    }
    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
      window.addEventListener(evt, loadGA, { once: true, passive: true });
    });
    // Nhanh khong-tuong-tac: cho luong chinh RANH roi moi nap. gtag/js nang
    // 165 KB; nap thang o 'load' thi no tranh CPU dung luc trinh duyet con dang
    // ve, do duoc TBT 240ms va diem PSI nhay 95-99 that thuong. Qua idle callback
    // thi TBT 140-150ms va diem dung yen.
    // timeout 2000 BAO DAM van chay du may ban den dau -> khong mat phien nhu
    // ban timeout co dinh 3,5s truoc day. Nhanh tuong tac o tren VAN nap ngay.
    function napKhiRanh() {
      if ('requestIdleCallback' in window) requestIdleCallback(loadGA, { timeout: 2000 });
      else setTimeout(loadGA, 200);
    }
    if (document.readyState === 'complete') napKhiRanh();
    else window.addEventListener('load', napKhiRanh, { once: true });
  })();
</script>
